<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" font-family="Arial, sans-serif" font-size="13">
  <rect width="980" height="620" fill="#F8F9FA"/>

  <!-- Title -->
  <text x="490" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F4E79">Coupled 2x6 DOSTO Fabric — RSTP topology after v9 (2026-06-30)</text>
  <text x="490" y="52" text-anchor="middle" font-size="11.5" fill="#595959">4736-117 (Fzg 145) coupled B-end to B-end with 4736-105 (Fzg 133)  |  36 consist switches combined</text>

  <!-- ===================== TRAIN BLOCKS ===================== -->
  <!-- 117 (master) block, left -->
  <rect x="40" y="120" width="360" height="300" rx="10" fill="#EEF3F8" stroke="#9DB8CF" stroke-width="1.5"/>
  <text x="220" y="108" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F4E79">4736-117 (Fzg 145) — "master"</text>
  <text x="220" y="408" text-anchor="middle" font-size="10.5" fill="#888">18 switches: A1..F3  (cars A B C D E F)</text>

  <!-- 105 (backup) block, right -->
  <rect x="580" y="120" width="360" height="300" rx="10" fill="#EEF3F8" stroke="#9DB8CF" stroke-width="1.5"/>
  <text x="760" y="108" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F4E79">4736-105 (Fzg 133) — "backup"</text>
  <text x="760" y="408" text-anchor="middle" font-size="10.5" fill="#888">18 switches: A1..F3  (cars A B C D E F)</text>

  <!-- ===================== ROOT (105 D1) ===================== -->
  <rect x="620" y="150" width="150" height="58" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="2.5"/>
  <text x="695" y="172" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#548235">nv6-D1-v8-133</text>
  <text x="695" y="190" text-anchor="middle" font-size="10.5" fill="#548235">RSTP ROOT (priority 0)</text>
  <text x="695" y="202" text-anchor="middle" font-size="9.5" fill="#888">a0:59:3a:d0:6c:80</text>
  <text x="788" y="142" font-size="11" fill="#548235" font-weight="bold">merged-fabric root</text>

  <!-- 117 D1 (its own former root, now non-root) -->
  <rect x="80" y="150" width="150" height="50" rx="8" fill="#FFFFFF" stroke="#9DB8CF" stroke-width="1.5"/>
  <text x="155" y="170" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#1F4E79">nv6-D1-v8-145</text>
  <text x="155" y="187" text-anchor="middle" font-size="9.5" fill="#888">117 D1 (now reaches root via coupler)</text>

  <!-- ===================== COUPLER SWITCHES ===================== -->
  <!-- 117 B1 (active coupler, ROOT port) -->
  <rect x="250" y="250" width="140" height="62" rx="8" fill="#DEEBF7" stroke="#2E74B5" stroke-width="2.5"/>
  <text x="320" y="272" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#2E74B5">nv6-B1-v8-145</text>
  <text x="320" y="289" text-anchor="middle" font-size="10" fill="#2E74B5">e0-2: ROOT / FWD</text>
  <text x="320" y="303" text-anchor="middle" font-size="9.5" fill="#888">cost 20000 · native 999</text>

  <!-- 105 A1 (active coupler peer, DESG) -->
  <rect x="590" y="250" width="140" height="62" rx="8" fill="#DEEBF7" stroke="#2E74B5" stroke-width="2.5"/>
  <text x="660" y="272" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#2E74B5">nv6-A1-v8-133</text>
  <text x="660" y="289" text-anchor="middle" font-size="10" fill="#2E74B5">e0-2: DESG / FWD</text>
  <text x="660" y="303" text-anchor="middle" font-size="9.5" fill="#888">cost 20000 · native 999</text>

  <!-- 117 B3 (redundant coupler) -->
  <rect x="250" y="335" width="140" height="56" rx="8" fill="#F2F2F2" stroke="#A6A6A6" stroke-width="2"/>
  <text x="320" y="357" text-anchor="middle" font-weight="bold" font-size="12" fill="#7F7F7F">nv6-B3-v8-145</text>
  <text x="320" y="374" text-anchor="middle" font-size="9.5" fill="#7F7F7F">e0-2: ALTERNATE / BLOCKED</text>

  <!-- 105 B3 (redundant coupler peer) -->
  <rect x="590" y="335" width="140" height="56" rx="8" fill="#F2F2F2" stroke="#A6A6A6" stroke-width="2"/>
  <text x="660" y="357" text-anchor="middle" font-weight="bold" font-size="12" fill="#7F7F7F">nv6-B3-v8-133</text>
  <text x="660" y="374" text-anchor="middle" font-size="9.5" fill="#7F7F7F">e0-2: down / blocked</text>

  <!-- ===================== COUPLER LINKS ===================== -->
  <!-- ACTIVE link: 117 B1 <-> 105 A1 (green, forwarding) -->
  <line x1="390" y1="281" x2="590" y2="281" stroke="#548235" stroke-width="3.5"/>
  <text x="490" y="273" text-anchor="middle" font-size="11" font-weight="bold" fill="#548235">ACTIVE coupler — FORWARDING</text>
  <text x="490" y="316" text-anchor="middle" font-size="9.5" fill="#888">10G full  ·  ~95 Mbps each way  ·  0 TC churn</text>

  <!-- REDUNDANT link: 117 B3 <-> 105 B3 (grey dashed, blocked) -->
  <line x1="390" y1="363" x2="590" y2="363" stroke="#A6A6A6" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="490" y="356" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7F7F7F">REDUNDANT coupler — BLOCKED (RSTP)</text>

  <!-- root-path arrows: 117 D1 -> 117 B1 -> active link -> 105 A1 -> 105 D1 -->
  <line x1="155" y1="200" x2="155" y2="281" stroke="#2E74B5" stroke-width="1.4"/>
  <line x1="155" y1="281" x2="250" y2="281" stroke="#2E74B5" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="730" y1="281" x2="620" y2="281" stroke="#548235" stroke-width="1.4"/>
  <line x1="695" y1="250" x2="695" y2="208" stroke="#548235" stroke-width="1.4" marker-end="url(#arr)"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>

  <!-- ===================== v9 CALLOUT BOX ===================== -->
  <rect x="40" y="445" width="900" height="80" rx="8" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="55" y="468" font-size="12.5" font-weight="bold" fill="#1F4E79">v9 changes validated on all 8 coupler ports (A1/A3/B1/B3 x both trains):</text>
  <text x="62" y="489" font-size="11.5" fill="#333">M1 — flat symmetric coupler port-cost 20000  -&gt; eliminates the continuous RSTP topology-change (MAC-flush) storm.</text>
  <text x="62" y="508" font-size="11.5" fill="#333">M2 — coupler native VLAN 999 (allowed set 5,15 kept)  -&gt; stops the cross-train VLAN-1 (192.168.1.0/24) bridge that broke switch DHCP.</text>

  <!-- ===================== LEGEND ===================== -->
  <text x="55" y="555" font-size="11" font-weight="bold" fill="#595959">Legend:</text>
  <rect x="110" y="546" width="22" height="12" rx="2" fill="#E2EFDA" stroke="#548235" stroke-width="2"/>
  <text x="138" y="556" font-size="10.5" fill="#595959">RSTP root</text>
  <rect x="215" y="546" width="22" height="12" rx="2" fill="#DEEBF7" stroke="#2E74B5" stroke-width="2"/>
  <text x="243" y="556" font-size="10.5" fill="#595959">active coupler switch</text>
  <rect x="375" y="546" width="22" height="12" rx="2" fill="#F2F2F2" stroke="#A6A6A6" stroke-width="2"/>
  <text x="403" y="556" font-size="10.5" fill="#595959">blocked / redundant</text>
  <line x1="530" y1="552" x2="560" y2="552" stroke="#548235" stroke-width="3.5"/>
  <text x="566" y="556" font-size="10.5" fill="#595959">forwarding link</text>
  <line x1="665" y1="552" x2="695" y2="552" stroke="#A6A6A6" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="701" y="556" font-size="10.5" fill="#595959">blocked link</text>

  <text x="490" y="595" text-anchor="middle" font-size="9.5" fill="#AAAAAA">Nomad Digital — schematic of the coupler region; only the coupler-relevant switches are shown. Each train additionally contains its full A1..F3 ring.</text>
</svg>
