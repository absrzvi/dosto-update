---
swagger: "2.0"
info:
  description: "(Updated 19th October 2023)\n\nThis document provides an overview\
    \ of the Network Management System (NMS) API.\n\n## Authentication\nAuthentication\
    \ is done by first getting an authentication token and then passing this along\
    \ in the header (the `Auth-Token` field) for each subsequent call towards the\
    \ API. The authentication token is valid for 1 week. A valid username and password\
    \ needs to be passed to the authenticate request. Contact Nomad Digital's Service\
    \ Desk to get a valid username and password.\n\nAn example of doing an authentication\
    \ request with curl would be:\n\n    curl -X POST https://nms-example.nomadrail.com/nms/rest/user/authenticate\
    \ \\\n         -H \"cache-control: no-cache\" \\\n         -H \"content-type:\
    \ application/json;charset=UTF-8\" \\\n         -d '{\"username\": \"$USERNAME\"\
    , \"password\": \"$PASSWORD\"}'\n\n\n## Calling the API\nAs mentioned, after you\
    \ have retrieved the authentication token from the authenticate call, you need\
    \ to add this to the header of your request. An example:\n\n    curl -X GET https://nms-example.nomadrail.com/nms/rest/monitoring/trains?projectId=1\
    \ \\\n         -H \"cache-control: no-cache\" \\\n         -H \"content-type:\
    \ application/json;charset=UTF-8\" \\\n         -H \"Auth-Token: $AUTH_TOKEN\"\
    \n\n\n## Project and Train IDs\nIt is important to know that the API, when asking\
    \ for a project or train ID, will need an internal ID (the \"relativeId\" of the\
    \ train). For the project and for the trains, you can retrieve all of these relative\
    \ IDs as follows:\n\nRetrieve the project ID:\n\n    curl -X GET https://nms-example.nomadrail.com/nms/rest/project\
    \ \\\n         -H \"cache-control: no-cache\" \\\n         -H \"content-type:\
    \ application/json;charset=UTF-8\" \\\n         -H \"Auth-Token: $AUTH_TOKEN\"\
    \n\nRetrieve all the train IDs (linked to their official IDs):\n\n    curl -X\
    \ GET https://nms-example.nomadrail.com/nms/rest/train/project/{projectId} \\\n\
    \         -H \"cache-control: no-cache\" \\\n         -H \"content-type: application/json;charset=UTF-8\"\
    \ \\\n         -H \"Auth-Token: $AUTH_TOKEN\"\n\nYou can then query the API using\
    \ the \"relativeId\" field of the train.\n\n## Timezone\nThe API uses UTC (Coordinated\
    \ Universal Time) for retrieving and sending timestamps. For each call that needs\
    \ a timestamp, the user must specify which timezone they are using in the following\
    \ format: `yyyy-MM-dd'T'HH:mm:ssZ`.\n\nFor example, `2019-10-11T06:00:00Z` for\
    \ Zulu time (UTC) or `2019-10-11T06:00:00+03:00` for UTC + 3 hours.\n\nThe user\
    \ must encode their timezone when requesting data from the API. An example of\
    \ a query with a timestamp added:\n\n    curl -X GET https://nms-example.nomadrail.com/nms/rest/gpsData?projectId=1&trainId=1044&from=2019-08-29T18:40:00%2B02:00&to=2019-08-29T20:00:00%2B02:00\
    \ \\\n         -H \"cache-control: no-cache\" \\\n         -H \"content-type:\
    \ application/json;charset=UTF-8\" \\\n         -H \"Auth-Token: $AUTH_TOKEN\"\
    \n\nThis request in particular is retrieving information for timestamps in the\
    \ CEST (Central European Summer Time) timezone (UTC + 2 hours)."
  version: "2023.3.0"
  title: "Network Management System API"
  contact:
    name: "Jan Haegeman"
    email: "ext.jan.haegeman@nomadrail.com"
