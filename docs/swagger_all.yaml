definitions:
  Alarm:
    type: "object"
    properties:
      ct:
        type: "integer"
        format: "int64"
      ve:
        type: "string"
      error:
        type: "string"
      id:
        type: "integer"
        format: "int64"
      alarmId:
        type: "integer"
        format: "int64"
      state:
        type: "integer"
        format: "int32"
      projectId:
        type: "integer"
        format: "int32"
      trainId:
        type: "integer"
        format: "int32"
      incidentId:
        type: "string"
      device:
        type: "string"
      type:
        type: "string"
      level:
        type: "integer"
        format: "int32"
      description:
        type: "string"
      emailSent:
        type: "boolean"
      faultLat:
        type: "number"
        format: "double"
      faultLong:
        type: "number"
        format: "double"
  AlarmEvent:
    type: "object"
    properties:
      messageInfo:
        type: "string"
        description: "Internal string identifier for the type of message"
        enum:
        - "TRAINUSER_V1"
        - "VIRTUALUSER_NEXTGEN_V1"
        - "DIO_RTL_V1"
        - "TRIP_SQI"
        - "MAR3_LINK_STATISTICS_V1"
        - "MAR3_GPS"
        - "IBIS_IP_GPS"
        - "MAR3_GSM_STATISTICS_V1"
        - "MAR3_LTE_STATISTICS_V1"
        - "MAR3_WCDMA_STATISTICS_V1"
        - "MAR3_LINK_SESSION_V1"
        - "MAR3_SIM_STATISTIC"
        - "SIM_V1"
        - "BATCH_STATISTIC_MESSAGE"
        - "ALARM_EVENT"
        - "ALARM_INCIDENT"
        - "CAPTIVE_PORTAL_V1"
        - "ZABBIX_TRIGGER_EVENT_V1"
        - "NOT_IMPORTANT"
        - "HYBRID_CONSIST_V1"
        - "DEVICE_CONSIST_V1"
        - "TRAIN_MASTER_MAPPING_V1"
        - "SYNC_CLIENT_V1"
        - "RADIO_USER_COUNT_V1"
        - "VLAN_MONITOR"
        - "MAR3_CONGESTION_V1"
        - "PORTAL_SATISFACTION_V1"
        - "CAPACITY_TEST_V1"
        - "EVENT_V1"
        - "NMS_TRAIN_INFORMATION_V1"
      trainId:
        type: "integer"
        format: "int32"
        description: "The relative ID of the train"
      boxId:
        type: "integer"
        format: "int32"
        description: "CCU Identifier"
      id:
        type: "integer"
        format: "int64"
        description: "Unique identifier"
      type:
        type: "string"
        description: "The type of alarm"
      level:
        type: "integer"
        format: "int32"
        description: "Numerical value for severity of alarm. Between 0-5. 0 being\
          \ lowest severity 5 being highest"
      description:
        type: "string"
        description: "A brief accurate description of the issue"
      alarmId:
        type: "string"
        description: "An identifier for the alarm"
      acknowledged:
        type: "boolean"
        description: "The type of alarm"
      deviceId:
        type: "string"
        description: "The identifier of the device effected"
      projectId:
        type: "integer"
        format: "int32"
        description: "ID of the project"
      timestamp:
        type: "string"
        format: "date-time"
        description: "Capture time as unix timestamp (milliseconds)"
  AlarmEventOverview:
    type: "object"
    properties:
      id:
        type: "string"
      name:
        type: "string"
      level:
        type: "integer"
        format: "int32"
      issues:
        type: "array"
        items:
          $ref: "#/definitions/AlarmEvent"
      incidents:
        type: "array"
        items:
          $ref: "#/definitions/AlarmIncident"
      diagnostics:
        $ref: "#/definitions/TrainMonitoringContextComposite"
      lastSeen:
        type: "string"
        format: "date-time"
      officialId:
        type: "string"
      inService:
        type: "boolean"
      trainId:
        type: "integer"
        format: "int32"
      projectId:
        type: "integer"
        format: "int32"
      timestamp:
        type: "string"
        format: "date-time"
  AlarmFiltersConfiguration:
    type: "object"
    properties:
      searchForAlarm:
        type: "boolean"
      alarmSeverity:
        type: "boolean"
      trainStatus:
        type: "boolean"
      inService:
        type: "boolean"
      opened:
        type: "boolean"
      outsideDepot:
        type: "boolean"
      trainType:
        type: "boolean"
      maintainers:
        type: "boolean"
      maintenanceBoxes:
        type: "boolean"
      currentService:
        type: "boolean"
      nextService:
        type: "boolean"
      showOfflineScheduledTrains:
        type: "boolean"
  AlarmIncident:
    type: "object"
