        type: "integer"
        format: "int32"
        description: "Backlight error detection. 0 = ok, 1 = error"
        readOnly: true
      status:
        type: "integer"
        format: "int32"
        description: "Backlight on or off status. 0 = off, 1 = on"
        readOnly: true
      current:
        type: "integer"
        format: "int32"
        description: "Brightness value (current). Range: 0-254"
        readOnly: true
      min:
        type: "integer"
        format: "int32"
        description: "Minimum brightness value. Range: 0-254"
        readOnly: true
      max:
        type: "integer"
