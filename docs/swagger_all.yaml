        type: "boolean"
      intervalBetweenMessages:
        type: "integer"
        format: "int32"
  Bounds:
    type: "object"
    properties:
      left:
        type: "integer"
        format: "int32"
      top:
        type: "integer"
        format: "int32"
      width:
        type: "integer"
        format: "int32"
      height:
        type: "integer"
        format: "int32"
  BrightnessTable:
    type: "object"
    properties:
      id:
        type: "integer"
        format: "int64"
