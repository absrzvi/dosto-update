      messageInfo:
        type: "string"
        description: "Internal string identifier for the type of message"
        enum:
        - "TRAINUSER_V1"
        - "VIRTUALUSER_NEXTGEN_V1"
        - "DIO_RTL_V1"
        - "TRIP_SQI"
        - "MAR3_LINK_STATISTICS_V1"
        - "MAR3_GPS"
        - "IBIS_IP_GPS"
        - "MAR3_GSM_STATISTICS_V1"
        - "MAR3_LTE_STATISTICS_V1"
        - "MAR3_WCDMA_STATISTICS_V1"
        - "MAR3_LINK_SESSION_V1"
        - "MAR3_SIM_STATISTIC"
        - "SIM_V1"
        - "BATCH_STATISTIC_MESSAGE"
        - "ALARM_EVENT"
        - "ALARM_INCIDENT"
        - "CAPTIVE_PORTAL_V1"
        - "ZABBIX_TRIGGER_EVENT_V1"
        - "NOT_IMPORTANT"
        - "HYBRID_CONSIST_V1"
        - "DEVICE_CONSIST_V1"
        - "TRAIN_MASTER_MAPPING_V1"
        - "SYNC_CLIENT_V1"
        - "RADIO_USER_COUNT_V1"
        - "VLAN_MONITOR"
        - "MAR3_CONGESTION_V1"
        - "PORTAL_SATISFACTION_V1"
        - "CAPACITY_TEST_V1"
        - "EVENT_V1"
        - "NMS_TRAIN_INFORMATION_V1"
      trainId:
        type: "integer"
        format: "int32"
        description: "The relative ID of the train"
      id:
        type: "integer"
        format: "int64"
      alarmId:
        type: "string"
      incidentId:
        type: "string"
      incidentPK:
        type: "string"
      type:
        type: "string"
      status:
        type: "string"
      projectId:
        type: "integer"
        format: "int32"
        description: "ID of the project"
      timestamp:
        type: "string"
        format: "date-time"
        description: "Capture time as unix timestamp (milliseconds)"
  AlarmState:
    type: "object"
    properties:
      status:
        type: "string"
        enum:
        - "NO_ALARMS"
        - "HAS_NEW_ALARMS"
        - "ALL_ALARMS_ACKED"
        - "OFFLINE"
        - "TEMP_OFFLINE"
      background:
        type: "string"
        enum:
        - "LIME"
        - "YELLOW"
        - "RED"
        - "BLACK"
        - "GREY"
      textColor:
        type: "string"
        enum:
        - "WHITE"
        - "BLACK"
  AlarmWeight:
    type: "object"
    properties:
      type:
        type: "string"
      criticalWeight:
        type: "integer"
        format: "int32"
      warningWeight:
        type: "integer"
        format: "int32"
  Area:
    type: "object"
    properties:
      positions:
        type: "array"
        description: "An array of positions used to define an area"
        items:
          $ref: "#/definitions/Position"
      center:
        $ref: "#/definitions/Position"
  AssignedJourney:
    type: "object"
    properties:
      deviceId:
        type: "string"
        description: "Unique device identifier"
      coachId:
        type: "integer"
        format: "int32"
        description: "Unique coach identifier"
      trainId:
        type: "integer"
        format: "int32"
        description: "The relative ID of the train"
      projectId:
        type: "integer"
        format: "int32"
        description: "ID of the project"
      id:
        type: "integer"
        format: "int64"
        description: "An internal unique identifier"
      journeyCode:
        type: "string"
        description: "Uniquely identifies an instance of a journey"
      deviceIdInt:
        type: "integer"
        format: "int32"
        description: "Numerical identifier for this device type, taken from the deviceId\
          \ field"
      payloadVersion:
        type: "integer"
        format: "int32"
        readOnly: true
      timestamp:
        type: "string"
        format: "date-time"
        description: "Capture time as unix timestamp (milliseconds)"
        readOnly: true
      messageInfo:
        type: "string"
        description: "Simple name of message type"
        readOnly: true
      deviceType:
        type: "string"
        description: "The type of device taken from the deviceId field"
        readOnly: true
  AuthenticatedUserComposite:
    type: "object"
    properties:
      id:
        type: "integer"
        format: "int64"
        description: "Internal identifier for the user"
      fullname:
        type: "string"
        description: "The full name of the user"
      name:
        type: "string"
        description: "The username of the user"
      projectPageSet:
        type: "object"
        description: "A list of pages the user has access to"
        additionalProperties:
          type: "array"
          uniqueItems: true
          items:
            type: "string"
      projectRoleSet:
        type: "object"
