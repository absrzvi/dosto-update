        additionalProperties:
          type: "string"
      token:
        type: "string"
        description: "A security token for an authenticated user. Used in requests\
          \ to the API"
      admin:
        type: "boolean"
        description: "Shows if the user has admin privileges"
      firstlogin:
        type: "boolean"
        description: "Shows if this is the first time the user has logged in"
  AuthenticationRequestComposite:
    type: "object"
    properties:
      username:
        type: "string"
        description: "The username of the user trying to authenticate"
      password:
        type: "string"
        description: "The password of the user trying to authenticate"
