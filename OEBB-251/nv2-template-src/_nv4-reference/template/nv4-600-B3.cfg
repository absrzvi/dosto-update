  description "ADU BR"
  switchport mode access vlan 9
  dhcp-server client-group sprechstelle
  {%- if train_id % 2 == 0 %}
  dhcp-server client-address 172.20.{{ 128 + (train_id // 2) }}.4
  {%- else %}
  dhcp-server client-address 172.20.{{ 128 + ((train_id - 1) // 2) }}.132
  {%- endif %}
  spanning-tree edge on
