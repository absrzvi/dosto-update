system hostname nv4-B3-v8-{{ ("%03d"|format(train_id)) }}

system admin password `seI2rPeFpS.JL6Ad3p9RV/kTTrgVAA`

{% include 'vlans.j2' %}

spanning-tree enable
lldp run
no ip dhcp-option82 enable

{% include 'dhcp_groups/service_group.j2' %}
{% include 'dhcp_groups/fis_group.j2' %}
{% include 'dhcp_groups/video_group.j2' %}
{% include 'dhcp_groups/afz_group.j2' %}
{% include 'dhcp_groups/sprechstelle_group.j2' %}
no ip dhcp-snooping enable
ip dhcp-server enable

interface e0-0
  description "Switch B1"
  switchport mode trunk prune allow 1-1000
  lldp mgmt-address vlan100
  spanning-tree port-cost 400100
  spanning-tree edge off
  enable

interface e0-1
  description "Switch B2"
  switchport mode trunk prune allow 1-1000
  lldp mgmt-address vlan100
  spanning-tree edge off
  enable

interface e0-2
  description "Frontkupplung B3"
  switchport mode trunk prune allow 5,15
  {%- if train_id < 10 %}
  spanning-tree port-cost {{ (train_id * 1000000) - 1 + 500000 }}
  {%- else %}
  spanning-tree port-cost {{ (train_id * 1000000) - 1 }}
  {%- endif %}
  spanning-tree edge off
  enable

interface e0-3
  no enable

interface e0-4
  description "AP B3"
  switchport mode trunk prune allow 100,10,20,30,31,131,150,1
  lldp mgmt-address vlan100
  poe priority critical
  spanning-tree edge on
  enable

interface e0-5
  description "Reserved"
  no enable

interface e1-0
  description "Exterior Camera B1"
  switchport mode access vlan 5
  dhcp-server client-group video
  {%- if train_id % 2 == 0 %}
  dhcp-server client-address 172.18.{{ 128 + (train_id // 2) }}.90
  {%- else %}
  dhcp-server client-address 172.18.{{ 128 + ((train_id - 1) // 2) }}.218
  {%- endif %}
  poe priority critical
  spanning-tree edge on
  enable

interface e1-1
  description "Exterior Camera B2"
  switchport mode access vlan 5
  dhcp-server client-group video
  {%- if train_id % 2 == 0 %}
  dhcp-server client-address 172.18.{{ 128 + (train_id // 2) }}.91
  {%- else %}
  dhcp-server client-address 172.18.{{ 128 + ((train_id - 1) // 2) }}.219
  {%- endif %}
  poe priority critical
  spanning-tree edge on
  enable

interface e1-2
  description "AP B4"
  switchport mode trunk prune allow 100,10,20,30,31,131,150,1
  lldp mgmt-address vlan100
  poe priority critical
  spanning-tree edge on
  enable

interface e1-3
  no enable

interface e1-4
  no enable

interface e1-5
  no enable

interface e1-6
  no enable

interface e1-7
  no enable

interface e1-8
  no enable

interface e1-9
