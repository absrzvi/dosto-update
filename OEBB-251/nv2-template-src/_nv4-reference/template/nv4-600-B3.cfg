  switchport mode access vlan 9
  dhcp-server client-group sprechstelle
  {%- if train_id % 2 == 0 %}
  dhcp-server client-address 172.20.{{ 128 + (train_id // 2) }}.20
  {%- else %}
  dhcp-server client-address 172.20.{{ 128 + ((train_id - 1) // 2) }}.148
  {%- endif %}
  poe priority critical
  spanning-tree edge on
  enable

interface e1-10
  no enable

interface e1-11
