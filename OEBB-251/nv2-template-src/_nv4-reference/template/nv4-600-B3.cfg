  dhcp-server client-group service
  {%- if train_id % 2 == 0 %}
  dhcp-server client-address 172.17.{{ train_id // 2 }}.2 vlan 2
  {%- else %}
  dhcp-server client-address 172.17.{{ (train_id - 1) // 2 }}.130 vlan 2
  {%- endif %}
  spanning-tree edge on
  enable

interface e1-12
  description "Funksensor B1"
  switchport mode access vlan 90
  no enable

interface e1-13
  description "Funksensor B3"
