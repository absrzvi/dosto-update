system hostname nv4-A3-v8-{{ ("%03d"|format(train_id)) }}

system admin password `seI2rPeFpS.JL6Ad3p9RV/kTTrgVAA`

{% include 'vlans.j2' %}

spanning-tree enable
lldp run
no ip dhcp-option82 enable

{% include 'dhcp_groups/fis_group.j2' %}
{% include 'dhcp_groups/video_group.j2' %}
{% include 'dhcp_groups/afz_group.j2' %}
{% include 'dhcp_groups/sprechstelle_group.j2' %}
no ip dhcp-snooping enable
ip dhcp-server enable

interface e0-0
  description "Switch A1"
  switchport mode trunk prune allow 1-1000
  lldp mgmt-address vlan100
  spanning-tree edge off
  enable

interface e0-1
  description "Switch A2"
  switchport mode trunk prune allow 1-1000
  lldp mgmt-address vlan100
  spanning-tree edge off
  enable

interface e0-2
  description "Frontkupplung A3"
  switchport mode trunk prune allow 5,15
  {%- if train_id < 10 %}
  spanning-tree port-cost {{ (train_id * 2000000) - 1 + 500000 }}
  {%- else %}
  spanning-tree port-cost {{ (train_id * 2000000) - 1 }}
  {%- endif %}
  spanning-tree edge off
  enable

interface e0-3
  no enable

interface e0-4
  description "AP A3"
  switchport mode trunk prune allow 100,10,20,30,31,131,150,1
  lldp mgmt-address vlan100
  poe priority critical
  spanning-tree edge on
  enable

interface e0-5
  description "reserved"
  no enable

interface e1-0
  description "Exterior Camera A1"
  switchport mode access vlan 5
  dhcp-server client-group video
  {%- if train_id % 2 == 0 %}
  dhcp-server client-address 172.18.{{ 128 + (train_id // 2) }}.80
  {%- else %}
  dhcp-server client-address 172.18.{{ 128 + ((train_id - 1) // 2) }}.208
  {%- endif %}
  poe priority critical
  spanning-tree edge on
  enable

interface e1-1
  description "Exterior Camera A2"
  switchport mode access vlan 5
  dhcp-server client-group video
  {%- if train_id % 2 == 0 %}
  dhcp-server client-address 172.18.{{ 128 + (train_id // 2) }}.81
  {%- else %}
  dhcp-server client-address 172.18.{{ 128 + ((train_id - 1) // 2) }}.209
  {%- endif %}
  poe priority critical
  spanning-tree edge on
  enable

interface e1-2
  description "AP A4"
  switchport mode trunk prune allow 100,10,20,30,31,131,150,1
  lldp mgmt-address vlan100
  poe priority critical
  spanning-tree edge on
  enable

interface e1-3
  no enable

interface e1-4
  description "Firewall"
  switchport mode trunk prune allow 2,3,5,6,7,8,9,12,15
  poe priority critical
  spanning-tree edge on
  enable

interface e1-5
  no enable

interface e1-6
  no enable

interface e1-7
  no enable

interface e1-8
  no enable

interface e1-9
  description "Sprechstelle A2R"
  switchport mode access vlan 9
  dhcp-server client-group sprechstelle
  {%- if train_id % 2 == 0 %}
  dhcp-server client-address 172.20.{{ 128 + (train_id // 2) }}.6
  {%- else %}
  dhcp-server client-address 172.20.{{ 128 + ((train_id - 1) // 2) }}.134
  {%- endif %}
  poe priority critical
  spanning-tree edge on
  enable

interface e1-10
  no enable

interface e1-11
  no enable

interface e1-12
  description "Funksensor A1"
  switchport mode access vlan 90
  no enable

interface e1-13
  description "Funksensor A3"
  switchport mode access vlan 90
  no enable

interface e1-14
  description "Frontanzeige A"
  switchport mode access vlan 3
  dhcp-server client-group fis
  {%- if train_id % 2 == 0 %}
  dhcp-server client-address 172.17.{{ 128 + (train_id // 2) }}.23
  {%- else %}
  dhcp-server client-address 172.17.{{ 128 + ((train_id - 1) // 2) }}.151
  {%- endif %}
  spanning-tree edge on
  enable

interface e1-15
  no enable

interface e2-0
  no enable

interface e2-1
  no enable

interface e2-2
  no enable

interface e2-3
  no enable

interface e2-4
  description "ADU AR"
  switchport mode access vlan 9
  dhcp-server client-group sprechstelle
  {%- if train_id % 2 == 0 %}
  dhcp-server client-address 172.20.{{ 128 + (train_id // 2) }}.3
  {%- else %}
  dhcp-server client-address 172.20.{{ 128 + ((train_id - 1) // 2) }}.131
  {%- endif %}
  spanning-tree edge on
  enable

interface e2-5
  description "Service VLAN PWLAN"
  switchport mode trunk prune allow 100,10,20,30,31,131,150
  no enable

interface vlan1
  ip address 192.168.1.102 255.255.255.0
  no lldp enable
  enable

interface vlan100
  ip address dhcp
  enable

{% if train_id < 128 -%}
ntp client source address 10.178.{{ train_id }}.1
{%- else -%}
ntp client source address 10.179.{{ train_id - 128 }}.1
{%- endif %}

snmp-server engineid 80000a0593a212121
snmp-server community snmpadmin rw
snmp-server user snmpadmin group snmpadmin sha1 "NomadStayOut!" aes "NomadStayOut!"
snmp-server group-access snmpadmin priv readview snmpadmin writeview snmpadmin
snmp-server view snmpadmin .1 included
snmp-server view snmpadmin .ISO included
snmp-server enable

service cmd-load enable
service ssh-server enable
no service telnet-server enable
no service http-rest-server enable
service https-rest-server enable
service console-server enable
service auto-usb-server enable
service tftp-server enable
